<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="homepage_style.css">
</head>

<body>
    <header>
        <div class="content-container header-content">
            <img src="./assets/icon/travel_blog_icon.svg" alt="Travel Blog Icon">

            <nav>
                <a href="#highlights-id">Highlights</a>
                <a href="#faq-id">FAQ</a>
                <a href="#contact-id">Contact</a>
            </nav>
        </div>
    </header>
    <section class="filler">
        <div class="content-container">
            <div class="yellow-slider">

                <div class="hero-content">
                    <h1>Cappadocia</h1>
                    <p>
                        From sunrise balloons to <br> 
                        hidden cave dwellings, <br>
                        every moment feels unreal <br>
                        in the best way.
                    </p>
                </div>

                <img class="yellow-curve" src="./assets/img/Vector 16 (1).png" alt="">

                <img class="cappadocia-icon" src="./assets/icon/Turkey_Cappadocia_Icon.svg" alt="Cappadocia Icon">

            </div>
        </div>
    </section>
    <main>
        <section id="highlights-id" class="highlights">
            <div class="highlights-headline">
                <img src="./assets/icon/rocket_launch_yellow.svg" alt="Gelbes Racketen Icon">
                <h2>Highlights</h2>
            </div>
        </section>
        <section id="faq-id" class="faQ">

        </section>
        <section id="contact-id" class="contact">

        </section>
    </main>
    <footer>
        <div class="content-container footer-content">
            <div class="footer-information">
                <div class="copyright-information">
                    <img src="./assets/icon/copyright_icon.svg" alt="Copyright Icon">
                    <p>Travel Blog 2026</p>
                </div>
                <p>Imprint</p>
                <p>Cookie Preferences</p>
            </div>
            <nav class="footer-navbar">
                <a href="https://www.tiktok.com/de-DE/" target="_blank">
                    <img src="./assets/icon/Tiktok_icon.svg" alt="Tiktok Icon">
                </a>
                <a href="https://www.youtube.com/" target="_blank">
                    <img src="./assets/icon/youtube_icon.svg" alt="Youtube Icon">
                </a>
                <a href="https://www.facebook.com/login/?next=https%3A%2F%2Fwww.facebook.com%2F%3Flocale%3Dde_DE"
                    target="_blank">
                    <img src="./assets/icon/facebook_icon.svg" alt="Facebook Icon">
                </a>
                <a href="https://www.instagram.com/?hl=de" target="_blank">
                    <img src="./assets/icon/Instagram_icon.svg" alt="Instagram Icon">
                </a>
            </nav>
        </div>

    </footer>
</body>

</html>

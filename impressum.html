<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impressum</title>

    <link rel="stylesheet" href="impressum_style.css">
</head>

<body class="imprint-page">

    <main class="imprint-main">

        <div class="imprint-container">

            <a class="imprint-back-link" href="./homepage.html"
                onclick="if (history.length > 1) { history.back(); return false; }">
                ← Zurück zur vorherigen Seite
            </a>

            <h1>Impressum</h1>

            <div class="imprint-details">

                <section>
                    <h2>Angaben zum Anbieter</h2>

                    <address>
                        [Vorname Nachname]<br>
                        [Straße und Hausnummer]<br>
                        [Postleitzahl und Ort]<br>
                        Deutschland
                    </address>
                </section>

                <section>
                    <h2>Kontakt</h2>

                    <p>
                        E-Mail:
                        <a href="mailto:kontakt@example.de">
                            kontakt@example.de
                        </a>
                    </p>

                    <p>Telefon: [Telefonnummer]</p>
                </section>

            </div>

        </div>

    </main>

</body>

</html>
